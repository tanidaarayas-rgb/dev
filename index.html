-{ margin: 0;padding:0;box-sizing:border-box; }

body{

canvas{

margin-top: 15px;

from{transform:translateY(-10px);}

<body>


<!--Menu-->


<div id="menuScreen">
 <div class="title"> GEOMETRY DASH</div>

   <button class="levelbtnEASY"onclick="startGame('easy')"> 
		 level 1<br>
		 
 <div class="level-tag">EASY.SINGLE JUMP</div>
	 </button> 	
	 <button class="level-btn btn-medium"onclick="startGame('medium')">
  level 2<br>

	 </button>
 </div>
</div>


<!--GAME-->


<div id="gameScreen">
 <div id="progressBar">/div>

 </div>

 </div>


	<!--WIN-->


<div id="winScreen" class="overlay-screen">

 <div class="action-btns">
 <button class="action-btn"onclick="showMenu()">MENU</button>
  <button class="action-btn pink" id="nextBtn" onclick="nextLevel()">NEXT</button>
 </div>
</div>

<div id="loseScreen"class="overlay-screen">
